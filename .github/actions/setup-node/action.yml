name: Setup node.js
description: "Set up your GitHub Actions workflow with a specific version of node.js"
inputs:
  package-manager-cache:
    description: "Cache Yarn's folder. Set to false in jobs that skip yarn install, or the post step fails because the folder doesn't exist."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Setup node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24.6.0"
        package-manager-cache: ${{ inputs.package-manager-cache }}
    - name: Enable Corepack
      run: corepack enable
      shell: bash
