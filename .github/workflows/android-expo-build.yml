name: Android Expo Cache Build

on:
  workflow_run:
    workflows: ["Expo Fingerprint Check"]
    types: [completed]
  workflow_dispatch: # Allows you to trigger the workflow manually from the Actions tab

jobs:
  check-build-needed:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check-build.outputs.needs_build }}

    steps:
      - name: Download needs_android_build artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: needs_android_build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check if build is needed
        id: check-build
        run: |
          # A manual run has no fingerprint check artifact; the build job skips the upload itself if
          # S3 already has this fingerprint.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEEDS_BUILD=true
          else
            NEEDS_BUILD=$(cat needs_android_build.txt)
          fi
          echo "needs_build=$NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "Android build needed: $NEEDS_BUILD"

  android-expo-cache-build:
    needs: check-build-needed
    if: ${{ needs.check-build-needed.outputs.needs_build == 'true' }}
    runs-on: ubuntu-24.04 # Pinned: setup-ruby lacks our .ruby-version on ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Android environment
        uses: ./.github/actions/setup-android-environment

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Set up env for ci
        run: touch .env.shared && touch keys.shared.json && scripts/setup/setup-env-for-ci

      # Computed here, not taken from the fingerprint check, so the key always matches the commit this
      # job built. Same hash `expo run:android` computes (@expo/fingerprint, all platforms).
      - name: Generate Expo fingerprint
        id: fingerprint
        run: |
          FINGERPRINT=$(npx @expo/fingerprint fingerprint:generate | jq -r '.hash')
          KEY="${FINGERPRINT}.android.tar.gz"
          S3_PATH="s3://mobile-cached-builds/eigen/cached-builds/${KEY}"
          echo "Fingerprint: $FINGERPRINT"
          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "s3_path=$S3_PATH" >> $GITHUB_OUTPUT
          if aws s3 ls "$S3_PATH" > /dev/null 2>&1; then
            echo "✅ $S3_PATH already exists, skipping the build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Build with Gradle directly instead of `expo run:android` on an emulator. The emulator ran next
      # to Gradle and starved the runner of memory, and `expo run:android` only uploads after
      # installing on it. It also builds just the emulator's ABI (x86_64), which Apple Silicon
      # emulators can't run. Same arguments as `expo run:android`, but for arm64-v8a, the ABI of
      # emulators on Apple Silicon Macs. The cache key has no ABI, so one ABI must serve everyone.
      - name: Build debug APK
        if: steps.fingerprint.outputs.exists != 'true'
        working-directory: android
        run: |
          ./gradlew app:assembleDebug -x lint -x test --configure-on-demand \
            -PreactNativeDevServerPort=8081 \
            -PreactNativeArchitectures=arm64-v8a

      # Same archive layout as expo/plugins/build-cache-s3: the APK at the root of the tarball.
      - name: Upload APK to S3
        if: steps.fingerprint.outputs.exists != 'true'
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK not found"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi
          tar -czf "${{ steps.fingerprint.outputs.key }}" -C "$(dirname "$APK")" "$(basename "$APK")"
          aws s3 cp "${{ steps.fingerprint.outputs.key }}" "${{ steps.fingerprint.outputs.s3_path }}"
          echo "✅ Uploaded to S3: ${{ steps.fingerprint.outputs.s3_path }}"

  # Only after the fingerprint check on main, not for manual runs. If the fingerprint check itself
  # fails or is cancelled, the build never runs and nothing alerts.
  notify-failure:
    needs: [check-build-needed, android-expo-cache-build]
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Needed for .env.releases, which carries the Slack webhook.
      - name: Setup repository environment
        uses: ./.github/actions/setup-repo-environment
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Notify Slack
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          bundle exec fastlane notify_build_cache_broken \
            message:"the Android cache build failed for ${COMMIT:0:10} on main, so no Android build was uploaded for its fingerprint."
