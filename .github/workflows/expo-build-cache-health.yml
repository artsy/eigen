name: Expo Build Cache Health

# Alerts when main's current fingerprint still has no cached iOS or Android build in S3. This catches
# builds that never ran (a cancelled fingerprint check, a skipped build), which never produce a failed
# run for the cache build workflows to report.

on:
  schedule:
    - cron: "0 9,15 * * 1-5" # 09:00 and 15:00 UTC on weekdays
  workflow_dispatch:

env:
  # Only main posts to Slack; a branch run just logs the message
  SKIP_SLACK_REPORT: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
  BUCKET: mobile-cached-builds
  # The iOS cache build alone takes ~80 min, plus queueing on macOS runners
  GRACE_HOURS: 3

jobs:
  check-build-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # AWS credentials, plus .env.releases, which carries the Slack webhook
      - name: Setup repository environment
        uses: ./.github/actions/setup-repo-environment
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check main's fingerprint has cached builds
        id: health
        run: |
          LATEST_KEY=eigen-expo-fingerprint/latest.txt
          FINGERPRINT=$(aws s3 cp "s3://${BUCKET}/${LATEST_KEY}" - | tr -d '[:space:]')
          # latest.txt is only rewritten when main's fingerprint changes
          CHANGED_AT=$(aws s3api head-object --bucket "$BUCKET" --key "$LATEST_KEY" --query LastModified --output text)
          AGE_HOURS=$(( ($(date +%s) - $(date -d "$CHANGED_AT" +%s)) / 3600 ))
          echo "Fingerprint ${FINGERPRINT}, changed ${AGE_HOURS}h ago (${CHANGED_AT})"

          MISSING=()
          for PLATFORM in ios android; do
            if aws s3api head-object --bucket "$BUCKET" --key "eigen/cached-builds/${FINGERPRINT}.${PLATFORM}.tar.gz" > /dev/null 2>&1; then
              echo "✅ ${PLATFORM} build found"
            else
              echo "❌ ${PLATFORM} build missing"
              MISSING+=("$PLATFORM")
            fi
          done

          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "alert=false" >> "$GITHUB_OUTPUT"
          elif [ "$AGE_HOURS" -lt "$GRACE_HOURS" ]; then
            echo "Missing builds, but the fingerprint changed less than ${GRACE_HOURS}h ago; the cache builds may still be running"
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=main's fingerprint ${FINGERPRINT:0:12} changed ${AGE_HOURS}h ago and still has no cached build for: ${MISSING[*]}." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Ruby
        if: steps.health.outputs.alert == 'true'
        uses: ./.github/actions/setup-ruby

      - name: Notify Slack
        if: steps.health.outputs.alert == 'true'
        env:
          MESSAGE: ${{ steps.health.outputs.message }}
        run: bundle exec fastlane notify_build_cache_broken message:"$MESSAGE"
