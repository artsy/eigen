name: 🤖 AI PR Review

on:
  pull_request:
    # closed is for the AI review's outcome experiments (artsy/duchamp#168); it never starts a review.
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, closed]

jobs:
  claude-review:
    uses: artsy/duchamp/.github/workflows/claude-review.yml@main
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      review-app-private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      openai-api-key: ${{ secrets.OPENAI_API_KEY }}
