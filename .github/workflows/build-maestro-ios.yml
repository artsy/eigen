name: Build iOS QA App for Maestro

on:
  # Called by nightly-qa.yml, which also runs the e2e tests on the build
  workflow_call:
    # TODO revert before merge: lets the PR-only workflow build this branch on Blacksmith and upload
    # it under its own name
    inputs:
      runs-on:
        type: string
        default: macos-26
      zip-name:
        description: S3 file name for a non-main build, so it doesn't replace Artsy-latest.zip
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch: # Builds and uploads to S3 without running the e2e tests

jobs:
  build-ios-qa:
    # TODO revert before merge: also builds a branch when it gets its own zip name
    if: github.ref == 'refs/heads/main' || inputs.zip-name != ''
    runs-on: ${{ inputs.runs-on || 'macos-26' }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup repository environment
        uses: ./.github/actions/setup-repo-environment
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Setup iOS environment
        uses: ./.github/actions/setup-ios-environment

      - name: Build iOS app and upload to S3 for Maestro
        run: bundle exec fastlane build_maestro_ios
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODE_LIST_TIMEOUT: 120
          MAESTRO_IOS_ZIP_NAME: ${{ inputs.zip-name }}
