name: Build iOS QA App for Maestro

on:
  schedule:
    - cron: "0 6 * * 1-5" # Runs at 6:00 AM UTC on weekdays
  workflow_dispatch: # Allows manual trigger

jobs:
  # Skips the scheduled build when main hasn't changed since the last successful one
  has-main-changed:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/skip-unchanged-scheduled-run.yml
    permissions:
      actions: write # to cancel the run

  build-ios-qa:
    needs: has-main-changed
    if: needs.has-main-changed.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup repository environment
        uses: ./.github/actions/setup-repo-environment
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Setup iOS environment
        uses: ./.github/actions/setup-ios-environment

      - name: Build iOS app and upload to S3 for Maestro
        run: bundle exec fastlane build_maestro_ios
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODE_LIST_TIMEOUT: 120
