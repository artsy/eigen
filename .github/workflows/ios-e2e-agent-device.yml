name: iOS E2E Tests (agent-device)

on:
  # Called by nightly-qa.yml once the iOS QA build has succeeded, independently of the Maestro suite
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch: # Allows you to trigger the workflow manually from the Actions tab, on the latest QA build
  # TODO revert before merge: runs only the iOS deeplink flows, 3 times, on this PR, against the
  # latest QA build, to diagnose deeplink-email.ios
  pull_request:
    paths:
      - .github/workflows/ios-e2e-agent-device.yml
      - e2e-agent-device/**
      - scripts/utils/run_agent_device_suite

env:
  AGENT_DEVICE_NO_UPDATE_NOTIFIER: 1

# Two runs racing to save the runner cache made one of them fail to save it, so runs on a branch take
# turns. The group is spelled out because inside a called workflow `github.workflow` is the caller's
# name, which the Android suite would share. On a branch a newer run makes the older one pointless; on
# main a newer run waits instead, so it doesn't cancel the nightly's.
concurrency:
  group: e2e-agent-device-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e-tests:
    # Blacksmith rather than GitHub-hosted macos-26, where simulator launches were slow enough to crash the XCTest runner
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 60
    # TODO revert before merge: 3 copies on a PR to measure flakiness, 1 otherwise
    strategy:
      fail-fast: false
      matrix:
        repeat: ${{ github.event_name == 'pull_request' && fromJSON('[1, 2, 3]') || fromJSON('[1]') }}
    env:
      # TODO revert before merge: on a PR, only the deeplinks and no Slack
      SKIP_FLOWS: ${{ github.event_name == 'pull_request' && 'login signup' || '' }}
      SKIP_SLACK_REPORT: ${{ github.event_name == 'pull_request' && '1' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # agent-device builds an XCTest runner with xcodebuild, which must match the simulator runtime
      # from ios-config.json. The runner image's default Xcode is newer and can't target that runtime.
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(jq -r '.xcode_version' ios-config.json).app"

      # Boots the simulator that ships with the runner image for this Xcode, like React Navigation's
      # agent-device CI does, as early as possible: the boot isn't waited for here, so the simulator
      # settles while the rest of the setup runs. A freshly booted simulator is slow for its first minutes.
      - name: Boot iOS simulator
        run: |
          IPHONE_MODEL=$(jq -r '.iphone_model' ios-config.json)
          IOS_VERSION=$(jq -r '.ios_version' ios-config.json)
          SIM_DEVICE_TYPE=$(jq -r '.simulator_device_type' ios-config.json)
          SIM_RUNTIME=$(jq -r '.simulator_runtime' ios-config.json)

          SIMULATOR_UDID=$(xcrun simctl list devices available --json |
            jq -r --arg runtime "$SIM_RUNTIME" --arg name "$IPHONE_MODEL" '.devices[$runtime] // [] | map(select(.name == $name)) | first | .udid // empty')
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "::warning::No preinstalled ${IPHONE_MODEL} on ${SIM_RUNTIME}, creating one"
            SIMULATOR_UDID=$(xcrun simctl create "${IPHONE_MODEL} Test" "${SIM_DEVICE_TYPE}" "${SIM_RUNTIME}")
          fi
          echo "📱 Using ${IPHONE_MODEL} (iOS ${IOS_VERSION}): $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> $GITHUB_ENV

          echo "🚀 Booting simulator in the background..."
          xcrun simctl boot "$SIMULATOR_UDID" || true

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          # this job never runs `yarn install`, so there is no yarn cache to save
          package-manager-cache: "false"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up env for ci
        run: touch .env.shared && touch keys.shared.json && scripts/setup/setup-env-for-ci

      - name: Set up maestro env
        run: ./scripts/setup/setup-env-for-maestro ios

      - name: Download iOS App
        run: aws s3 cp s3://artsy-citadel/eigen/builds/ios/Artsy-latest.zip ./Artsy.zip

      - name: Unzip iOS App
        run: unzip Artsy.zip

      - name: Install agent-device
        run: |
          # Single source of truth for the pinned version, shared with the other platform's
          # workflow and e2e-agent-device/README.md
          AGENT_DEVICE_VERSION=$(cat e2e-agent-device/agent-device-version)
          echo "AGENT_DEVICE_VERSION=$AGENT_DEVICE_VERSION" >> $GITHUB_ENV
          npm install -g "agent-device@${AGENT_DEVICE_VERSION}"
          echo "AGENT_DEVICE_STATE_DIR=$GITHUB_WORKSPACE/.agent-device" >> $GITHUB_ENV
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV
          agent-device doctor --remote

      - name: Restore agent-device iOS runner
        id: runner-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.agent-device/apple-runner/derived
          key: agent-device-runner-${{ env.AGENT_DEVICE_VERSION }}-xcode-${{ env.XCODE_VERSION }}

      - name: Install app on iOS simulator
        run: |
          echo "⏳ Waiting for the simulator booted at the start of the job..."
          WAIT_COUNT=0
          until xcrun simctl list devices | grep "$SIMULATOR_UDID" | grep -q "(Booted)"; do
            WAIT_COUNT=$((WAIT_COUNT + 1))
            if [ $WAIT_COUNT -ge 90 ]; then
              echo "❌ Timeout: Simulator failed to boot within 180 seconds"
              exit 1
            fi
            sleep 2
          done
          echo "✅ Simulator is booted"

          echo "📱 Installing app..."
          ./scripts/utils/install_app_in_booted_sims.sh

          echo "🚀 Bring simulator to foreground..."
          open -a simulator

          # No app site association prefetch here, unlike the Maestro workflow: opening the files in Safari
          # can hang for minutes and leave simctl unresponsive, which then fails the agent-device runner
          # startup. The deeplinks flow passes without it.

      # Building the runner from scratch takes several minutes, so it gets a generous budget
      # Retried once: runner startup can fail on a slow simulator, which agent-device's own error hints
      # suggest retrying
      - name: Prepare agent-device iOS runner
        id: prepare-runner
        run: |
          prepare() {
            agent-device prepare ios-runner --platform ios --udid "$SIMULATOR_UDID" --timeout 900000 --verbose --json
          }
          prepare || { echo "::warning::agent-device runner startup failed, retrying once"; prepare; }

      # No flow has run yet, so these logs can't contain the test account
      - name: Collect simulator list
        if: failure() && steps.prepare-runner.outcome == 'failure'
        run: xcrun simctl list devices > "$AGENT_DEVICE_STATE_DIR/simctl-devices.txt" 2>&1 || true

      - name: Upload agent-device runner logs
        if: failure() && steps.prepare-runner.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-device-ios-runner-logs-${{ matrix.repeat }}
          path: |
            .agent-device/**/*.log
            .agent-device/**/*.ndjson
            .agent-device/simctl-devices.txt
            ~/.agent-device/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # Saved right away so a later test failure doesn't throw away the built runner
      - name: Save agent-device iOS runner
        # Only one copy saves, so the PR's copies don't race for the same key
        if: steps.runner-cache.outputs.cache-hit != 'true' && matrix.repeat == 1
        uses: actions/cache/save@v4
        with:
          path: ~/.agent-device/apple-runner/derived
          key: agent-device-runner-${{ env.AGENT_DEVICE_VERSION }}-xcode-${{ env.XCODE_VERSION }}

      # TODO revert before merge: the app's fetch of the SendGrid link got HTTP 403 on CI runners
      # (Sentry EIGEN-AYTC), while it's a 302 elsewhere. This shows which hop returns it to this
      # runner, with the app's user agent. Prints statuses and hosts/paths only, never the tracking URL.
      - name: Diagnose the email link's redirects
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          URL=$(grep -o 'https://email-link.artsy.net/[^"]*' e2e-agent-device/flows/deeplink-email.ios.ad)
          UA="Artsy/1 CFNetwork/3860.100.1 Darwin/25.3.0"
          echo "Runner public IP: $(curl -s --max-time 10 https://checkip.amazonaws.com)"
          for i in 1 2 3; do
            echo "--- request $i: email-link.artsy.net/ls/click"
            curl -s -o /dev/null -L --max-time 30 -A "$UA" -D - "$URL" | tr -d '\r' | awk '
              tolower($1) ~ /^http\// { print "  status " $2 }
              tolower($1) == "location:" { sub(/\?.*/, "", $2); print "  -> " $2 }
              tolower($1) == "server:" || tolower($1) == "cf-mitigated:" { print "     " $1 " " $2 }'
            sleep 5
          done

      - name: Run agent-device E2E Tests
        run: ./scripts/utils/run_agent_device_suite ios "$SIMULATOR_UDID"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-device-ios-artifacts-${{ matrix.repeat }}
          # Reports only: this repo's artifacts are public, and agent-device logs and screenshots
          # can show the test account. Failure screenshots go to S3 and Slack instead.
          path: |
            e2e-agent-device/artifacts/ios/**/junit.xml
            e2e-agent-device/artifacts/ios/failures.json
          if-no-files-found: ignore
          retention-days: 7
