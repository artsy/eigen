name: PR Preview

# While a PR carries the `preview` label, or its branch name starts with `review-app-`, every push
# publishes its JS bundle to the Expo Updates channel `review-app-<number>`, as long as the PR
# has not changed native code. Draft PRs count.
#
# The native check (scripts/pr-preview/checkNativeStatus.ts) compares three fingerprints:
#   level:  PR matches main's latest build        -> publish
#   behind: main changed native code since the PR -> publish, and warn in the PR description
#   ahead:  the PR changed native code            -> don't publish, ask for new betas
# The result is written into a managed block of the PR description.
#
# Removing the label or closing the PR deletes the channel and its branch from Expo, then resets
# that block of the description to the placeholder the PR template starts with. On a `review-app-*`
# branch, removing the label does nothing: the branch name still asks for a preview.

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, closed]

permissions:
  contents: read
  pull-requests: write # edit the PR description

env:
  CHANNEL: review-app-${{ github.event.pull_request.number }}

# Runs for one PR share a group, so a newer push cancels an older publish, and closing the PR or
# removing the label cancels a publish before cleanup. Label events for any other label do nothing,
# so they get their own group (the run id). Otherwise adding an unrelated label would cancel a
# running publish, then skip itself, and leave no preview.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'preview' && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  # Fingerprint at the commit where the PR branched off main. Main's workflow caches it under
  # native-fingerprint-<sha>; on a miss we compute it here and save it for the next push.
  base-fingerprint:
    # Same-repo PRs only: fork PRs get no secrets, so they would fail inside the setup steps.
    # The first two jobs carry the gate. Every later job depends on them and is skipped with them.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (
          (github.event.action == 'synchronize' || github.event.action == 'opened') &&
          (contains(github.event.pull_request.labels.*.name, 'preview') || startsWith(github.event.pull_request.head.ref, 'review-app-'))
        )
      )
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      fp_base: ${{ steps.resolve.outputs.fp_base }}

    steps:
      # The PR head, not the merge commit, and the full history for merge-base
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Find merge base with main
        id: merge-base
        run: echo "sha=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"

      - name: Restore merge-base fingerprint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .native-fingerprint
          key: native-fingerprint-${{ steps.merge-base.outputs.sha }}

      # From here to the save step, the tree is the merge base, so the setup actions below are the
      # ones that existed there. The fingerprint command is inline because the PR's scripts are
      # missing from older merge bases.
      - name: Checkout merge base
        if: steps.cache.outputs.cache-hit != 'true'
        run: git checkout --detach "${{ steps.merge-base.outputs.sha }}"

      - name: Configure AWS credentials
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup JavaScript environment
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-javascript-environment

      - name: Setup Ruby
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-ruby

      - name: Setup iOS environment
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-ios-environment

      - name: Set up Java
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache Gradle dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      - name: Download android assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/setup/download-assets-android
        shell: bash

      - name: Compute merge-base fingerprint
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .native-fingerprint
          npx @expo/fingerprint fingerprint:generate | jq -r '.hash' > .native-fingerprint/fingerprint.txt

      - name: Read merge-base fingerprint
        id: resolve
        run: |
          fp_base=$(tr -d '[:space:]' < .native-fingerprint/fingerprint.txt)
          if ! echo "$fp_base" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Merge-base fingerprint is not a 40-character sha1: \"$fp_base\"" >&2
            exit 1
          fi
          echo "Merge base ${{ steps.merge-base.outputs.sha }} has fingerprint $fp_base"
          echo "fp_base=$fp_base" >> "$GITHUB_OUTPUT"

      - name: Save merge-base fingerprint
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .native-fingerprint
          key: native-fingerprint-${{ steps.merge-base.outputs.sha }}

  # Fingerprint at the PR head. Same setup as expo-fingerprint-check.yml, or the hash differs.
  pr-fingerprint:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (
          (github.event.action == 'synchronize' || github.event.action == 'opened') &&
          (contains(github.event.pull_request.labels.*.name, 'preview') || startsWith(github.event.pull_request.head.ref, 'review-app-'))
        )
      )
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      fp_pr: ${{ steps.fingerprint.outputs.fingerprint }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Setup iOS environment
        uses: ./.github/actions/setup-ios-environment

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      - name: Download android assets
        run: ./scripts/setup/download-assets-android
        shell: bash

      - name: Generate PR fingerprint
        id: fingerprint
        run: yarn tsx scripts/pr-preview/checkNativeStatus.ts fingerprint

  native-status:
    needs: [base-fingerprint, pr-fingerprint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.status.outputs.status }}
      fp_base: ${{ steps.status.outputs.fp_base }}
      fp_pr: ${{ steps.status.outputs.fp_pr }}
      fp_main: ${{ steps.status.outputs.fp_main }}
      runtime_pr: ${{ steps.runtime.outputs.pr }}
      runtime_main: ${{ steps.runtime.outputs.main }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Reads main's latest fingerprint from S3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Compare fingerprints
        id: status
        env:
          FP_BASE: ${{ needs.base-fingerprint.outputs.fp_base }}
          FP_PR: ${{ needs.pr-fingerprint.outputs.fp_pr }}
        run: yarn tsx scripts/pr-preview/checkNativeStatus.ts status --base "$FP_BASE" --pr "$FP_PR"

      # Fingerprints skip expo.runtimeVersion, so a PR branched before a release bump still reads
      # `level`. expo-updates only loads a bundle on builds with the same runtime.
      - name: Read runtime versions
        id: runtime
        shell: bash
        run: |
          git fetch --depth=1 origin main
          runtime_pr=$(jq -er '.expo.runtimeVersion' app.json)
          runtime_main=$(git show origin/main:app.json | jq -er '.expo.runtimeVersion')
          echo "pr=$runtime_pr" >> "$GITHUB_OUTPUT"
          echo "main=$runtime_main" >> "$GITHUB_OUTPUT"

  # `ahead` skips this job: the PR changed native code, so the bundle could crash builds without it.
  publish:
    needs: native-status
    if: needs.native-status.outputs.status != 'ahead'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup repository environment
        uses: ./.github/actions/setup-repo-environment
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Download fonts from s3
        run: ./scripts/setup/download-fonts

      - name: Install bin modules
        uses: ./.github/actions/setup-bin-modules

      - name: Cache Metro bundler cache
        uses: actions/cache@v4
        with:
          path: .cache/metro
          key: metro-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'babel.config.js', 'alias.js', 'metro.config.js') }}

      # The lane puts the description inside single quotes in a shell line, so it carries only the PR
      # number and SHA, never the PR title.
      - name: Publish to Expo Updates
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_UPDATES_TOKEN }}
          DESCRIPTION: "PR preview #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
        run: bundle exec fastlane deploy_to_expo_updates deployment_name:"$CHANNEL" description:"$DESCRIPTION" platform:all preview:true

  update-pr-description:
    needs: [native-status, publish]
    # !cancelled() instead of always(): a run cancelled by a newer push must not write a stale report.
    if: ${{ !cancelled() && needs.native-status.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Write preview result to the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          STATUS: ${{ needs.native-status.outputs.status }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          FP_BASE: ${{ needs.native-status.outputs.fp_base }}
          FP_PR: ${{ needs.native-status.outputs.fp_pr }}
          FP_MAIN: ${{ needs.native-status.outputs.fp_main }}
          RUNTIME_PR: ${{ needs.native-status.outputs.runtime_pr }}
          RUNTIME_MAIN: ${{ needs.native-status.outputs.runtime_main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: yarn tsx scripts/pr-preview/updatePrDescription.ts report

  cleanup-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (
          github.event.action == 'closed' &&
          (contains(github.event.pull_request.labels.*.name, 'preview') || startsWith(github.event.pull_request.head.ref, 'review-app-'))
        ) ||
        (
          github.event.action == 'unlabeled' && github.event.label.name == 'preview' &&
          !startsWith(github.event.pull_request.head.ref, 'review-app-')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-javascript-environment

      - name: Install bin modules
        uses: ./.github/actions/setup-bin-modules

      - name: Delete preview channel and branch
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_UPDATES_TOKEN }}
        run: |
          delete() {
            local kind=$1 out
            if out=$(./bin/node_modules/.bin/eas "$kind:delete" "$CHANNEL" --non-interactive 2>&1); then
              echo "$out"
            elif grep -q "Could not find $kind" <<<"$out"; then
              echo "$kind $CHANNEL is already gone"
            else
              echo "$out" >&2
              return 1
            fi
          }
          delete channel
          delete branch

      - name: Reset the preview section of the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: yarn tsx scripts/pr-preview/updatePrDescription.ts clear
