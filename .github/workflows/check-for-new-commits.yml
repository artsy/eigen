# Tells a scheduled workflow whether its branch has changed since that workflow's last successful run,
# so a nightly build can skip rebuilding the same commit. Runs started any other way (e.g. manually)
# always report a change, so they go ahead.
#
# To force a rebuild of an unchanged commit, start the workflow manually (workflow_dispatch). Re-running
# a scheduled run doesn't work: a re-run is still a "schedule" event on the same commit.
#
# Jobs that should only follow a new build, like the e2e tests after the QA builds, should `needs:` the
# build job itself. A skipped build then skips them too. See nightly-qa.yml.
#
# Usage:
#
#   jobs:
#     has-main-changed:
#       if: github.ref == 'refs/heads/main'
#       uses: ./.github/workflows/check-for-new-commits.yml
#       permissions:
#         actions: read # to look up the last successful run
#
#     build:
#       needs: has-main-changed
#       if: needs.has-main-changed.outputs.changed == 'true'
name: Check for new commits

on:
  workflow_call:
    outputs:
      # Also 'true' for runs that weren't scheduled (e.g. manual ones), even on an unchanged commit,
      # because those always go ahead
      changed:
        description: "'true' unless this is a scheduled run on a commit that already ran successfully"
        value: ${{ jobs.check.outputs.changed }}

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to look up the last successful run
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for new commits since the last successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # In a called workflow, GITHUB_WORKFLOW_REF is the caller's, e.g.
          # artsy/eigen/.github/workflows/nightly-qa.yml@refs/heads/main
          CALLER_WORKFLOW=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          # A failed lookup (rate limit, 5xx, token problem) must not cost the day its build, so it falls
          # back to an empty SHA, which never matches. Without the `if`, `bash -e` would fail this step.
          if ! LAST_RUN_SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$CALLER_WORKFLOW" \
            --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // empty'); then
            echo "::warning::Couldn't look up the last successful run of $CALLER_WORKFLOW, building anyway"
            LAST_RUN_SHA=""
          fi
          echo "$CALLER_WORKFLOW on $GITHUB_REF_NAME: $GITHUB_SHA, last successful run: ${LAST_RUN_SHA:-none}"

          if [ "$LAST_RUN_SHA" = "$GITHUB_SHA" ]; then
            echo "No new commits since the last successful run, skipping. To build anyway, start the workflow manually."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
