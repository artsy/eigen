buildscript {
    ext {
        googlePlayServicesVersion = "17.0.0"
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        firebaseIidVersion = "21.1.0" // Needed for react-native-device-info
        googlePlayServicesAuthVersion = "21.4.0"
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath('com.google.gms:google-services:4.4.0')
        // Keep in lockstep with the version pinned by @sentry/react-native
        // (node_modules/@sentry/react-native/plugin/build/withSentryAndroidGradlePlugin.js)
        classpath("io.sentry:sentry-android-gradle-plugin:6.22.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

plugins {
  id("co.uzzu.dotenv.gradle") version "4.0.0"
}

allprojects {
    repositories {
        maven { url "https://appboy.github.io/appboy-android-sdk/sdk" }
        maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username 'mapbox'
                password = env.MAPBOX_DOWNLOAD_TOKEN.value
            }
        }
    }
}

// CI verification builds pass -PcmakeJobs=N (scripts/ci/build-for-tests-android) to cap parallel
// C++ compiles per native module. Without it ninja runs nproc + 2 jobs per module: 38 on CircleCI
// xlarge, which reports the host's 36 CPUs but only has 16 CPUs / 16 GB, so a few modules
// compiling at once run the container out of memory.
if (project.hasProperty("cmakeJobs")) {
    def cmakeJobs = project.property("cmakeJobs").toString()
    subprojects {
        ["com.android.application", "com.android.library"].each { pluginId ->
            plugins.withId(pluginId) {
                extensions.getByName("androidComponents").finalizeDsl { android ->
                    android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                        "-DCMAKE_JOB_POOLS=compile=${cmakeJobs}".toString(),
                        "-DCMAKE_JOB_POOL_COMPILE=compile",
                    ])
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
