version: 2.1
setup: true

# Setup config (CircleCI dynamic config). It decides whether the native jobs need to run, then
# continues with .circleci/continue_config.yml, where all the actual jobs and workflows live.
# See scripts/ci/detect-native-changes.

orbs:
  continuation: circleci/continuation@2.0.1
  node: circleci/node@7.2.1

parameters:
  # Parameters that pipeline triggers can set: echo's API trigger and the CircleCI scheduled
  # pipelines. A setup config has to accept them, and detect-native forwards them to
  # continue_config.yml, which declares the same ones.
  run_workflow_build-run-tests-for-echo:
    type: boolean
    default: false
  run_workflow_test-build-deploy:
    type: boolean
    default: true
  run_workflow_nightly:
    type: boolean
    default: false
  run_workflow_flag_check:
    type: boolean
    default: false
  # Keep these two in sync with continue_config.yml so both configs share the node_modules cache.
  node_version:
    type: string
    default: "24.6.0"
  node_modules_cache_key:
    type: string
    default: v32-node_modules-{{ checksum ".manifests/node_modules" }}

jobs:
  detect-native:
    executor:
      name: node/default
      tag: << pipeline.parameters.node_version >>
    resource_class: medium
    steps:
      - checkout
      # detect-native-changes needs node_modules and the aws cli only when it can skip something:
      # not for echo/scheduled pipelines, and not on the beta branches (no native checks there).
      - when:
          condition:
            and:
              - << pipeline.parameters.run_workflow_test-build-deploy >>
              - not:
                  matches:
                    pattern: "^beta-(ios|android)$"
                    value: << pipeline.git.branch >>
          steps:
            - run:
                name: Generate node_modules manifest
                command: |
                  mkdir -p .manifests
                  scripts/ci/generate-manifest.js .manifests/node_modules '^yarn\.lock$' '^patches/' '^package\.json$'
            - node/install-packages:
                pkg-manager: yarn-berry
                cache-version: << pipeline.parameters.node_modules_cache_key >>
                # Only the fingerprint runs here: skip the dependencies' build scripts and the root
                # postinstall (echo download, prettier). Yarn patches still apply.
                override-ci-command: yarn install --immutable --mode=skip-build
            - run:
                name: Set up aws cli
                command: scripts/setup/setup-awscli
      - run:
          name: Detect native changes
          environment:
            PIPELINE_PARAMETERS: >-
              {"run_workflow_build-run-tests-for-echo": << pipeline.parameters.run_workflow_build-run-tests-for-echo >>,
              "run_workflow_test-build-deploy": << pipeline.parameters.run_workflow_test-build-deploy >>,
              "run_workflow_nightly": << pipeline.parameters.run_workflow_nightly >>,
              "run_workflow_flag_check": << pipeline.parameters.run_workflow_flag_check >>}
          command: scripts/ci/detect-native-changes /tmp/continuation-parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/continuation-parameters.json

workflows:
  setup:
    jobs:
      - detect-native:
          # For DANGER_GITHUB_API_TOKEN, used to check whether the PR is a draft
          context: danger-github-oss
